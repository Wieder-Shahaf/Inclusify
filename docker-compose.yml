# Inclusify Docker Compose
# Development and production service orchestration
#
# Usage:
#   Development: docker compose --profile dev up
#   Production:  BUILD_TARGET=runtime docker compose --profile prod up
#   Build dev:   docker compose build
#   Build prod:  BUILD_TARGET=runtime docker compose build
#
# BUILD_TARGET selects the Dockerfile stage for both services. Default is
# `development` (hot-reload, full deps). `runtime` builds the slim production
# images: CPU-only backend (~2GB) and the Next.js standalone frontend (~250MB).

services:
  # ============================================
  # PostgreSQL Database (dev only)
  # ============================================
  postgres:
    image: postgres:16-alpine
    profiles:
      - dev
    environment:
      POSTGRES_DB: ${PGDATABASE:-inclusify}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      # Host port shifted off the default so this stack runs alongside another
      # local project that already binds 5432 (container port unchanged).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (dev only — refresh token storage)
  # ============================================
  redis:
    image: redis:7-alpine
    profiles:
      - dev
    ports:
      # Shifted off default 6379 to avoid clashing with another local project.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # MinIO — local S3-compatible storage (mirrors Cloudflare R2 in prod)
  # ============================================
  minio:
    image: minio/minio:latest
    profiles:
      - dev
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data

  # One-shot: wait for MinIO, then create the bucket (idempotent). The backend's
  # ensure_container() also self-heals the bucket, so this is belt-and-braces.
  minio-init:
    image: minio/mc:latest
    profiles:
      - dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin}; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET:-texts};
      echo 'minio bucket ready: ${S3_BUCKET:-texts}';
      "

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    profiles:
      - dev
      - prod
    # Tag the image per build target so a dev image and a prod image never
    # collide on the same name (avoids `up` silently reusing a stale image
    # built for the other target).
    image: inclusify-backend:${BUILD_TARGET:-development}
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        BUILD_TIME: ${BUILD_TIME:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    environment:
      - PGHOST=${PGHOST:-postgres}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-inclusify}
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-devpassword}
      - PGSSL=${PGSSL:-}
      # Redis
      - REDIS_URL=redis://redis:6379
      # Authentication
      - JWT_SECRET=${JWT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3100}
      # Email
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-Inclusify <onboarding@resend.dev>}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3100}
      # LLM inference service (transformers-based, not vLLM)
      # vLLM is VNet-only now; for local dev tunnel with: ssh -L 8001:localhost:8001 azureuser@<vm>
      # (host.docker.internal reaches the tunnel on the host from inside the container)
      - VLLM_URL=${VLLM_URL:-http://host.docker.internal:8001}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      # Model health (Stack A §2.3): TRUE when vLLM is serverless (Modal) so the
      # health poll infers from the circuit breaker instead of probing a cold GPU.
      - MODEL_SCALE_TO_ZERO=${MODEL_SCALE_TO_ZERO:-false}
      - MODEL_HEALTH_CACHE_TTL=${MODEL_HEALTH_CACHE_TTL:-300.0}
      # Object storage — MinIO locally (S3-compatible), Cloudflare R2 in prod
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-texts}
      - S3_REGION=${S3_REGION:-auto}
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload in dev
      - ./backend:/app:cached
      # Persist uploaded text files across container restarts
      - ./backend/text_store:/app/text_store
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Next.js Frontend
  # ============================================
  frontend:
    profiles:
      - dev
      - prod
    # Tag the image per build target so a dev image and a prod image never
    # collide on the same name (avoids `up` silently reusing a stale image
    # built for the other target).
    image: inclusify-frontend:${BUILD_TARGET:-development}
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: ${BUILD_TARGET:-development}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Hot-reload file watching — required on Mac/WSL inside Docker
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      # Shifted off default 3000 to avoid clashing with another local project.
      # Browse the app at http://localhost:3100 (container port unchanged).
      - "3100:3000"
    volumes:
      # Mount source for hot-reload in dev
      - ./frontend:/app:cached
      # Preserve container node_modules
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
