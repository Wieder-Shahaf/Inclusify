[tool.ruff.lint]
# Ruff's documented default set, stated explicitly. CI installs ruff unpinned
# (`pip install ruff`), and 0.16 widened the implicit default to include I, UP,
# BLE, B, PIE... — which turned every untouched file in the repo into a lint
# error and broke CI on main with no commit to blame. Naming the set here makes
# `ruff check` deterministic across ruff releases.
# Adopting the wider set is a deliberate ~340-error cleanup, not a side effect of
# an upgrade: add codes here when you want them.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# logging.basicConfig() must run before other imports to capture import-time logs
"app/main.py" = ["E402"]
